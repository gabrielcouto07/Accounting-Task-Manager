{% extends "base.html" %}

{% block content %}
<div id="login-screen">
  <div id="login-box">
    <div class="login-logo">📊</div>
    <h2>Controle de Obrigações Contábeis</h2>
    <p>Acesse o painel de obrigações e subtarefas</p>

    <form action="/login" method="post">
      <label for="login-user">Usuário</label>
      <select id="login-user" name="user_id" required>
        {% for u in users %}
          <option value="{{ u.id }}">{{ u.nome }} ({{ u.id }})</option>
        {% endfor %}
      </select>

      <label for="login-pass">Senha</label>
      <input id="login-pass" name="senha" type="password" autocomplete="current-password" required>

      <button id="btn-entrar" type="submit">Entrar</button>
    </form>

    <div id="login-error" {% if error %}style="display:block"{% endif %}>
      Usuário ou senha inválidos.
    </div>

    <div class="login-hint">
      Demo gerente: gerente / gerente123<br>
      Demo equipes: fiscal, dp, contabil ou apoio / equipe123
    </div>
  </div>
</div>
{% endblock %}
